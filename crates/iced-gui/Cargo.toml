[package]
name = "simpler-notes-iced-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { git = "https://github.com/iced-rs/iced", features = [
    "wgpu",
    "highlighter",
    "tokio",
    "advanced",
] }
simpler-notes-core = { path = "../simpler-notes-core" }
rfd = "0.16"
tokio = { version = "1", features = ["fs"] }
comrak = "0.30"
parking_lot = "0.12"
