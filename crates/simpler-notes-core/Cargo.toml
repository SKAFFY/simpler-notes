[package]
name = "simpler-notes-core"
version = "0.1.0"
edition = "2021"

[dependencies]
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
notify = { version = "7", features = ["macos_kqueue"] }
rayon = "1"
thiserror = "1"
walkdir = "2"
parking_lot = "0.12"

git2 = { version = "0.19", optional = true }

[features]
default = []
git = ["dep:git2"]

[dev-dependencies]
tempfile = "3"
